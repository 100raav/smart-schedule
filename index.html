<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SmartSchedule — Create, organize and plan beautiful schedules for study, work, fitness, projects and everyday life. Local-first, offline-ready, export to PDF and image." />
    <meta name="theme-color" content="#f7f7f8" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SmartSchedule — Create. Organize. Plan.</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #boot-spinner {
        display: grid; place-items: center; min-height: 100vh; background: #f7f7f8;
        color: #6e7686; text-align: center;
      }
      .dot { animation: bounce 1.2s infinite ease-in-out; display: inline-block; }
      .dot:nth-child(2){ animation-delay: 0.15s } .dot:nth-child(3){ animation-delay: 0.3s }
      @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-spinner">
        <div>
          <div style="font-size:34px;letter-spacing:-1px;font-weight:800;color:#303ccb;margin-bottom:8px">SmartSchedule</div>
          <div style="font-size:14px;color:#8b93a3;margin-bottom:20px">Create. Organize. Plan.</div>
          <div style="font-size:20px">
            <span class="dot">·</span><span class="dot">·</span><span class="dot">·</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
