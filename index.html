<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SmartSchedule — Create, organize and plan beautiful schedules for study, work, fitness, projects and everyday life. Local-first, offline-ready, export to PDF and image." />
    <meta name="theme-color" content="#f7f7f8" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SmartSchedule — Create. Organize. Plan.</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #boot-spinner {
        display: grid; place-items: center; min-height: 100vh; background: #f7f7f8;
        color: #6e7686; text-align: center;
      }
      .dot { animation: bounce 1.2s infinite ease-in-out; display: inline-block; }
      .dot:nth-child(2){ animation-delay: 0.15s } .dot:nth-child(3){ animation-delay: 0.3s }
      @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-spinner">
        <div>
          <div style="font-size:34px;letter-spacing:-1px;font-weight:800;color:#303ccb;margin-bottom:8px">SmartSchedule</div>
          <div style="font-size:14px;color:#8b93a3;margin-bottom:20px">Create. Organize. Plan.</div>
          <div style="font-size:20px">
            <span class="dot">·</span><span class="dot">·</span><span class="dot">·</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Runs even if the app bundle itself fails to load (e.g. a cached HTML
      // shell pointing at deleted bundles after a deploy), so the visitor
      // always has a way out instead of a blank page.
      (function () {
        var shown = false;
        function bail(reason) {
          if (shown) return;
          shown = true;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font:16px/1.6 system-ui,sans-serif;background:#f7f7f8;color:#1b2033">' +
            '<div style="max-width:32rem"><h1 style="font-size:1.15rem;font-weight:700;margin:0 0 8px">SmartSchedule needs a refresh</h1>' +
            '<p style="margin:0 0 16px;color:#5b6070;font-size:.9rem">A cached copy of the app is out of date. Reloading fetches the current version and clears the offline cache.</p>' +
            '<button id="ss-reload" style="font:inherit;font-weight:600;padding:10px 20px;border-radius:10px;border:0;background:#1b2033;color:#fff;cursor:pointer">Reload</button>' +
            '<p style="margin:14px 0 0;color:#8b93a3;font-size:.75rem">' + reason + '</p></div></div>';
          document.getElementById('ss-reload').onclick = function () {
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).finally(function () {
                if (window.caches) return caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); });
              }).finally(function () { location.reload(); });
            } else {
              location.reload();
            }
          };
        }
        // Only react to a genuine module-load failure. There is deliberately
        // no timeout here: the app's own loader has a failsafe, and a timer
        // that misfires would cover a perfectly working page.
        var s = document.querySelector('script[type="module"]');
        if (s) {
          s.addEventListener('error', function () { bail('The app files could not be loaded.'); });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
