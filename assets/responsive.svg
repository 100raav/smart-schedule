    <text x="516" y="152">MON</text><text x="574" y="152">TUE</text><text x="632" y="152">WED</text><text x="676" y="152">THU</text>
  </g>
  <rect x="446" y="158" width="238" height="180" fill="#ffffff"/>
  <g stroke="#f0f2f6">
    <line x1="446" y1="182" x2="684" y2="182"/><line x1="446" y1="206" x2="684" y2="206"/>
    <line x1="446" y1="230" x2="684" y2="230"/><line x1="446" y1="254" x2="684" y2="254"/>
    <line x1="446" y1="278" x2="684" y2="278"/><line x1="446" y1="302" x2="684" y2="302"/>
    <line x1="446" y1="326" x2="684" y2="326"/>
  </g>
  <g stroke="#eceef3">
    <line x1="488" y1="158" x2="488" y2="338"/><line x1="546" y1="158" x2="546" y2="338"/>
    <line x1="604" y1="158" x2="604" y2="338"/><line x1="662" y1="158" x2="662" y2="338"/>
  </g>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="5.5" fill="#b6bcc7" text-anchor="end">
    <text x="484" y="166">08</text><text x="484" y="190">09</text><text x="484" y="214">10</text>
    <text x="484" y="238">11</text><text x="484" y="262">12</text><text x="484" y="286">13</text>
  </g>
  <rect x="492" y="162" width="50" height="16" rx="4" fill="#e0ebff" stroke="#5873f8"/>
  <rect x="492" y="162" width="2" height="16" fill="#5873f8"/>
  <text x="498" y="172" font-family="Inter, Segoe UI, sans-serif" font-size="5" font-weight="600" fill="#2b3383">Deep Work</text>
  <rect x="550" y="186" width="50" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="550" y="186" width="2" height="16" fill="#f59e0b"/>
  <text x="556" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="5" font-weight="600" fill="#92400e">Gym</text>
  <rect x="608" y="210" width="50" height="16" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <rect x="608" y="210" width="2" height="16" fill="#8b5cf6"/>
  <text x="614" y="220" font-family="Inter, Segoe UI, sans-serif" font-size="5" font-weight="600" fill="#5b21b6">Sync</text>
  <rect x="666" y="234" width="16" height="16" rx="4" fill="#d1fae5" stroke="#10b981"/>
  <rect x="492" y="282" width="50" height="16" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <rect x="492" y="282" width="2" height="16" fill="#ef4444"/>
  <text x="498" y="292" font-family="Inter, Segoe UI, sans-serif" font-size="5" font-weight="600" fill="#991b1b">Seminar</text>
  <rect x="550" y="306" width="50" height="16" rx="4" fill="#ccfbf1" stroke="#14b8a6"/>
  <rect x="550" y="306" width="2" height="16" fill="#14b8a6"/>
  <text x="556" y="316" font-family="Inter, Segoe UI, sans-serif" font-size="5" font-weight="600" fill="#115e59">Commute</text>
</svg>
